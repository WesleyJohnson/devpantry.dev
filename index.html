<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DevPantry.dev — everyday staple utilities for software engineers. Formatters, converters, and LLM helpers that run 100% client-side."
    />
    <title>DevPantry.dev — Developer Utility Belt</title>
    <script>
      // Set the theme class before React mounts to avoid a flash of the wrong theme.
      try {
        var stored = localStorage.getItem('devpantry-theme')
        if (stored !== 'light') document.documentElement.classList.add('dark')
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
